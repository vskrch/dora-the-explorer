name: Dora
options:
  bundleIdPrefix: com.dorasoft
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
packages:
  FSCore:
    path: Packages/FSCore
  FileOps:
    path: Packages/FileOps
  Thumbnails:
    path: Packages/Thumbnails
  Search:
    path: Packages/Search
  Archives:
    path: Packages/Archives
  ShellIntegration:
    path: Packages/ShellIntegration
  DesignSystem:
    path: Packages/DesignSystem
  AppCore:
    path: Packages/AppCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Dora:
    type: application
    platform: macOS
    sources:
      - path: Dora
    dependencies:
      - package: FSCore
      - package: FileOps
      - package: Thumbnails
      - package: Search
      - package: Archives
      - package: ShellIntegration
      - package: DesignSystem
      - package: AppCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dorasoft.dora
        PRODUCT_NAME: Dora the Explorer
        PRODUCT_MODULE_NAME: Dora
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Dora/Info.plist
        CODE_SIGN_ENTITLEMENTS: Dora/Dora.entitlements
        CODE_SIGN_IDENTITY: "-"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
        GCC_TREAT_WARNINGS_AS_ERRORS: NO
        SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    scheme:
      testTargets:
        - DoraTests
  DoraTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: DoraTests
    dependencies:
      - target: Dora
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dorasoft.dora.tests
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Dora the Explorer.app/Contents/MacOS/Dora the Explorer
        BUNDLE_LOADER: $(TEST_HOST)
